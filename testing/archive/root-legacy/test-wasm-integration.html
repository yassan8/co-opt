<!DOCTYPE html>
<html>
<head>
  <title>WASM Pilot Integration Test</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #f5f5f5; }
    .test { background: white; padding: 15px; margin: 10px 0; border-left: 4px solid #ccc; }
    .pass { border-left-color: #4caf50; color: #2e7d32; }
    .fail { border-left-color: #f44336; color: #c62828; }
    .warn { border-left-color: #ff9800; color: #e65100; }
    .info { border-left-color: #2196f3; color: #1565c0; }
    pre { overflow-x: auto; background: #f9f9f9; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 WASM Pilot Integration Test</h1>
  <div id="results"></div>
  
  <script>
    const log = (msg, type = 'info') => {
      const div = document.createElement('div');
      div.className = `test ${type}`;
      div.textContent = msg;
      document.getElementById('results').appendChild(div);
      console.log(`[${type.toUpperCase()}] ${msg}`);
    };

    const logPre = (title, content, type = 'info') => {
      const div = document.createElement('div');
      div.className = `test ${type}`;
      div.innerHTML = `<strong>${title}</strong><pre>${content}</pre>`;
      document.getElementById('results').appendChild(div);
    };

    (async () => {
      try {
        log('Starting WASM Pilot Integration Test...', 'info');

        // 1. Import the bridge module
        log('Importing optimizer bridge...', 'info');
        const bridge = await import('/rust-wasm/ts/optimization/optimizer-wasm-bridge.ts');
        const optimizeSystem = bridge.optimizeSystemOneIterationWasm;
        
        if (!optimizeSystem) {
          log('❌ Bridge import failed: optimizeSystemOneIterationWasm not found', 'fail');
          throw new Error('Bridge not found');
        }
        log('✓ Bridge imported successfully', 'pass');

        // 2. Prepare test payload
        const testPayload = {
          x: Array(12).fill(0).map((_, i) => 0.1 * (i + 1)),
          steps: Array(12).fill(0.01),
          residual0: Array(10).fill(0.1),
          residualsPerturbed: Array(12).fill(null).map(() => Array(10).fill(0.12)),
          damping: 0.01,
          trustRegionRadius: 100,
          varScales: Array(12).fill(1),
        };
        log(`✓ Prepared test payload (n=${testPayload.x.length}, m=${testPayload.residual0.length})`, 'pass');

        // 3. Call the bridge
        log('Calling optimizeSystemOneIterationWasm...', 'info');
        const result = optimizeSystem(testPayload);

        if (!result) {
          log('❌ Bridge returned null/undefined result', 'fail');
          throw new Error('Bridge returned null');
        }

        if (!result.ok) {
          log(`❌ Bridge returned ok=false: ${result.status}`, 'fail');
          throw new Error('Bridge returned error');
        }

        log(`✓ Bridge returned ok result: ${result.status}`, 'pass');

        // 4. Validate result structure
        log('Validating result structure...', 'info');
        const validations = [
          ['dx is array', Array.isArray(result.dx)],
          ['dx has correct size', result.dx.length === testPayload.x.length],
          ['dx values are finite', result.dx.every(x => Number.isFinite(x))],
          ['xNext is array', Array.isArray(result.xNext)],
          ['xNext has correct size', result.xNext.length === testPayload.x.length],
          ['xNext values are finite', result.xNext.every(x => Number.isFinite(x))],
          ['predictedReduction is finite', Number.isFinite(result.predictedReduction)],
          ['jacobianShape is valid', Array.isArray(result.jacobianShape) && result.jacobianShape.length === 2],
        ];

        let allPass = true;
        for (const [name, pass] of validations) {
          log(`  ${pass ? '✓' : '✗'} ${name}`, pass ? 'pass' : 'fail');
          allPass = allPass && pass;
        }

        if (!allPass) {
          throw new Error('Validation failed');
        }

        // 5. Display sample values
        const resultSummary = {
          'dx[0:3]': result.dx.slice(0, 3).map(x => x.toExponential(3)).join(', '),
          'xNext[0:3]': result.xNext.slice(0, 3).map(x => x.toFixed(6)).join(', '),
          'predictedReduction': result.predictedReduction.toExponential(3),
          'jacobianShape': `[${result.jacobianShape[0]}, ${result.jacobianShape[1]}]`,
          'usedDamping': result.usedDamping,
          'usedTrustRegionRadius': result.usedTrustRegionRadius,
        };
        logPre('Result Summary:', JSON.stringify(resultSummary, null, 2), 'pass');

        log('✅ ALL TESTS PASSED! WASM Pilot integration is working correctly.', 'pass');
      } catch (err) {
        log(`❌ Test failed: ${err.message}`, 'fail');
        console.error(err);
      }
    })();
  </script>
</body>
</html>
