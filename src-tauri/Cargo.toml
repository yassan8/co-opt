[package]
name = "co-opt-pro"
version = "0.1.0"
description = "co-opt-pro desktop backend"
authors = ["co-opt-pro"]
edition = "2021"
default-run = "co-opt-pro"

[lib]
name = "co_opt_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = true, features = ["clock"] }
rustfft = "6"
lazy_static = "1.5"
rayon = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
cocoa = "0.26"
core-graphics = "0.24"

# `tauri dev` uses Cargo's development profile.  Optical tracing is the hot
# path of the local optimizer, so leave dependencies debuggable while compiling
# this crate's numerical kernels with the same optimization level as release.
[profile.dev.package."co-opt-pro"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
