[package]
name = "surface_origins"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
serde_json = "1.0"
js-sys = "0.3"
rustfft = "6.2"
num-complex = "0.4"
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }

[features]
default = []
wasm-threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
