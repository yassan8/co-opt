<!DOCTYPE html>
<html>
<head>
  <title>WASM Pilot KKT Benchmark</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); padding: 30px; }
    h1 { color: #333; margin-top: 0; }
    .controls { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .controls button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
    .controls button:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    .controls button:active { transform: translateY(0); }
    .controls input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .status { padding: 15px; margin: 15px 0; border-radius: 4px; font-weight: 500; }
    .status.pending { background: #e3f2fd; color: #1565c0; border-left: 4px solid #1565c0; }
    .status.success { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; }
    .status.error { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }
    .results { margin-top: 30px; }
    .result-card { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 4px; border-left: 4px solid #ccc; }
    .result-card.pass { border-left-color: #4caf50; }
    .result-card.fail { border-left-color: #f44336; }
    .result-card.info { border-left-color: #2196f3; }
    .result-card strong { display: block; margin-bottom: 5px; }
    .metric { background: white; padding: 12px; margin: 8px 0; border-radius: 3px; font-family: 'Courier New', monospace; }
    .metric-label { color: #666; font-size: 12px; }
    .metric-value { color: #333; font-size: 16px; font-weight: bold; }
    .progress { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 10px 0; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.3s; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 12px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 WASM Pilot KKT Optimizer Benchmark</h1>
    
    <div class="controls">
      <button onclick="runBenchmark()">Run Benchmark</button>
      <button onclick="clearResults()">Clear Results</button>
      <label>Iterations: <input type="number" id="iterInput" value="80" min="1" max="500" style="width: 80px;"></label>
      <label>Repeats: <input type="number" id="repeatsInput" value="3" min="1" max="10" style="width: 80px;"></label>
      <label><input type="checkbox" id="useWasmCheckbox" checked> Use WASM Pilot</label>
    </div>

    <div id="status"></div>
    <div class="progress"><div id="progressBar" class="progress-bar" style="width: 0%;"></div></div>
    <div id="results"></div>
    <textarea id="debugLog" rows="10" readonly placeholder="Debug output will appear here..."></textarea>
  </div>

  <script>
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');
    const debugLog = document.getElementById('debugLog');

    const setStatus = (msg, type = 'pending') => {
      statusDiv.innerHTML = `<div class="status ${type}">${msg}</div>`;
      log(`[${type}] ${msg}`);
    };

    const log = (msg) => {
      const timestamp = new Date().toLocaleTimeString();
      debugLog.value += `${timestamp} ${msg}\n`;
      debugLog.scrollTop = debugLog.scrollHeight;
    };

    const addResult = (title, content, type = 'info') => {
      const card = document.createElement('div');
      card.className = `result-card ${type}`;
      card.innerHTML = `<strong>${title}</strong><pre>${content}</pre>`;
      resultsDiv.appendChild(card);
    };

    const updateProgress = (percent) => {
      document.getElementById('progressBar').style.width = percent + '%';
    };

    const clearResults = () => {
      resultsDiv.innerHTML = '';
      debugLog.value = '';
      statusDiv.innerHTML = '';
      updateProgress(0);
    };

    const runBenchmark = async () => {
      clearResults();
      setStatus('⏳ Initializing benchmark...', 'pending');

      try {
        updateProgress(5);

        // Import optimizer
        log('Importing optimization module...');
        const opgModule = await import('/optimization/optimizer-mvp.ts');
        const compareWasmPilot = opgModule.compareWasmPilotBenchmark;

        if (!compareWasmPilot) {
          throw new Error('compareWasmPilotBenchmark not found in module');
        }
        log('✓ Module imported successfully');
        updateProgress(15);

        const maxIterations = parseInt(document.getElementById('iterInput').value) || 80;
        const repeats = parseInt(document.getElementById('repeatsInput').value) || 3;
        const useWasm = document.getElementById('useWasmCheckbox').checked;

        log(`Ready to benchmark with: iterations=${maxIterations}, repeats=${repeats}, useWasm=${useWasm}`);
        setStatus(`Running ${repeats} benchmark iterations with maxIterations=${maxIterations}...`, 'pending');
        updateProgress(20);

        // Run benchmark
        const result = await compareWasmPilot({
          method: 'kkt',
          maxIterations: maxIterations,
          repeat: repeats,
          warmupDiscard: repeats > 1 ? 1 : 0,
          filterOutliers: repeats > 1,
        });

        updateProgress(80);
        log('✓ Benchmark completed');

        if (!result || typeof result !== 'object') {
          throw new Error(`Unexpected result type: ${typeof result}`);
        }

        log(`Results received: ${JSON.stringify(result).substring(0, 100)}...`);

        // Extract and display metrics
        const metrics = {
          'Baseline Iterations': result.baselineIterations || '?',
          'Baseline Time (ms)': result.baselineElapsedMs?.toFixed(2) || '?',
          'Pilot Calls': result.kktWasmPilotCalls || 0,
          'Pilot Hits': result.kktWasmPilotHits || 0,
          'Pilot Fallbacks': result.kktWasmPilotFallbacks || 0,
          'Pilot Hit Rate': ((result.kktWasmPilotHits / Math.max(result.kktWasmPilotCalls, 1)) * 100).toFixed(1) + '%',
          'Last Pilot Reason': result.kktWasmPilotLastReason || 'unknown',
          'Last Pilot Error': result.kktWasmPilotLastErrorDetail || 'none',
        };

        let metricsHtml = '';
        for (const [label, value] of Object.entries(metrics)) {
          metricsHtml += `<div class="metric">
            <div class="metric-label">${label}</div>
            <div class="metric-value">${value}</div>
          </div>`;
        }

        resultsDiv.innerHTML = `<div class="result-card pass">
          <strong>✅ Benchmark Results</strong>
          ${metricsHtml}
        </div>`;

        updateProgress(100);

        if (result.kktWasmPilotHits && result.kktWasmPilotHits > 0) {
          setStatus(`✅ SUCCESS: Pilot integrated! ${result.kktWasmPilotHits}/${result.kktWasmPilotCalls} hits`, 'success');
          log(`✅ WASM Pilot is working! Hit rate: ${((result.kktWasmPilotHits / result.kktWasmPilotCalls) * 100).toFixed(1)}%`);
        } else if (result.kktWasmPilotCalls && result.kktWasmPilotCalls > 0) {
          const fallbackReason = result.kktWasmPilotLastReason || 'unknown';
          setStatus(`⚠️ Pilot called but all fallbacks. Reason: ${fallbackReason}`, 'pending');
          log(`⚠️ All ${result.kktWasmPilotCalls} pilot calls fell back to JS. Reason: ${fallbackReason}`);
        } else {
          setStatus('ℹ️ Pilot not enabled or not available', 'pending');
          log('ℹ️ Pilot statistics not available');
        }

      } catch (err) {
        setStatus(`❌ Error: ${err.message}`, 'error');
        log(`❌ Error: ${err.message}`);
        console.error(err);
        addResult('Error Details', err.stack || err.toString(), 'fail');
      }
    };
  </script>
</body>
</html>
